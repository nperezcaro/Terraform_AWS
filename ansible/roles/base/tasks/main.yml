---
- name: Update all packages
  ansible.builtin.dnf:
    name: "*"
    state: latest
    update_cache: true
  become: true
  notify: reboot if kernel updated

- name: Install base packages
  ansible.builtin.dnf:
    name: "{{ base_packages }}"
    state: present
  become: true

- name: Install Python packages (system-wide)
  ansible.builtin.pip:
    name: "{{ python_packages }}"
    state: present
    extra_args: --upgrade
  become: true

- name: Set timezone to UTC
  community.general.timezone:
    name: UTC
  become: true

- name: Create app directory
  ansible.builtin.file:
    path: /opt/app
    state: directory
    owner: ec2-user
    group: ec2-user
    mode: "0755"
  become: true

- name: Write AWS region to profile
  ansible.builtin.lineinfile:
    path: /etc/profile.d/aws.sh
    line: "export AWS_DEFAULT_REGION={{ aws_region }}"
    create: true
    mode: "0644"
  become: true
